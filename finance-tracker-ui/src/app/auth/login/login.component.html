<div class="auth-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm">
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        required
      />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        required
      />
    </div>

    <!-- Error message -->
    <div *ngIf="errorMessage" class="text-danger mt-2">
      {{ errorMessage }}
    </div>

    <button class="btn btn-primary mt-3" [disabled]="!loginForm.valid">
      Login
    </button>

    <p class="mt-2">Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </form>
</div>
